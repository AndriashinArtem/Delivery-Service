services:
  app:
    build: .
    container_name: delivery-service

    ports:
      - "8080:8080"

    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_DB: parcels
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: